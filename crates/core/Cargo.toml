[package]
name = "mtc-core"
version = "0.5.0-rc.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
